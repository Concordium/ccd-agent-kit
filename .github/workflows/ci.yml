name: CI

on:
  pull_request:
  push:
    # Keep this branch allowlist synchronized with release-channels.json.
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      coverage_matrix: ${{ steps.coverage.outputs.matrix }}
      has_coverage: ${{ steps.coverage.outputs.has_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Derive Nx affected SHAs
        uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify affected projects
        if: github.event_name == 'pull_request'
        run: pnpm verify:affected

      - name: Verify full workspace
        if: github.event_name != 'pull_request'
        run: pnpm verify

      - name: Collect coverage files
        id: coverage
        run: node scripts/collect-coverage.mjs

      - name: Store package coverage reports
        if: steps.coverage.outputs.has_files == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-coverage
          path: packages/*/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  coverage:
    needs: verify
    if: needs.verify.outputs.has_coverage == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify.outputs.coverage_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download package coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-coverage
          path: packages

      - name: Upload package coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.file }}
          flags: ${{ matrix.flag }}
          disable_search: true
          fail_ci_if_error: true

  release:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.23.4

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create release packages and metadata
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
